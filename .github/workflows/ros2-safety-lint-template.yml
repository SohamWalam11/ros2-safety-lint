# Template: copy this file into your ROS 2 repository as .github/workflows/rosfix.yml.
# It is not triggered in this repository (manual dispatch only).
name: rosfix (ROS 2 static checks)

on:
  workflow_dispatch:
  # In your own repository use:
  # push:
  # pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  rosfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rosfix
        run: cargo install rosfix --locked
      - name: Run rosfix
        # Exit code 1 fails the job when warnings/errors are found (configure with --fail-on).
        run: rosfix . --format sarif --output rosfix.sarif --fail-on error
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rosfix.sarif
          category: rosfix
