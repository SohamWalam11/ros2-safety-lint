name: ROS 2 Safety Static Analysis
on:
  push:
    branches: [ main, master, rolling, humble ]
  pull_request:
    branches: [ main, master, rolling, humble ]

jobs:
  ros2-safety-lint:
    name: Run ros2-safety-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ros2-safety-lint
        run: cargo install --path crates/ros2-safety-lint

      - name: Run Linter and generate SARIF
        run: |
          # Create results directory
          mkdir -p .results
          # Run the linter on all relevant ROS 2 files
          ros2-safety-lint --path . --format sarif > .results/ros2-safety-lint.sarif
        continue-on-error: true

      - name: Upload SARIF report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ros2-safety-lint-sarif
          path: .results/ros2-safety-lint.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: .results/ros2-safety-lint.sarif
          category: ros2-safety-lint
