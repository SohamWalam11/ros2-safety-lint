name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check Formatting
      run: cargo fmt --check
    - name: Clippy Lints
      run: cargo clippy -- -D warnings
    - name: Run Tests
      run: cargo test
