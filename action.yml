# GitHub Action: run rosfix on a ROS 2 repository and upload SARIF to code scanning.
#
#   - uses: SohamWalam11/ros2-safety-lint@v1
#     with:
#       path: src
#       fail-on: error
name: rosfix
description: Static checks for silent ROS 2 misconfigurations (parameters, topics, QoS, launch, ros2_control, Nav2, SROS2)
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: Workspace or package directory to analyse
    default: "."
  version:
    description: rosfix release tag to use (e.g. v1.0.0); "latest" uses the newest release
    default: latest
  fail-on:
    description: Fail the job at or above this severity (error, warning, info, never)
    default: error
  distro:
    description: ROS distribution (humble, jazzy, kilted, rolling) for knowledge-pack checks
    default: ""
  args:
    description: Extra arguments passed to rosfix
    default: ""
  upload-sarif:
    description: Upload results to GitHub code scanning
    default: "true"
  pr-suggestions:
    description: On pull requests, post findings on changed lines as review comments, with verified fixes as one-click suggested changes (needs pull-requests write permission)
    default: "false"
outputs:
  sarif:
    description: Path of the SARIF report
    value: ${{ steps.run.outputs.sarif }}
runs:
  using: composite
  steps:
    - name: Install rosfix release binary
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          macOS-X64)   target=x86_64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        repo="SohamWalam11/ros2-safety-lint"
        tag="$VERSION"
        if [ "$tag" = "latest" ]; then tag=$(gh release view --repo "$repo" --json tagName -q .tagName); fi
        dir="$RUNNER_TEMP/rosfix"; mkdir -p "$dir"
        # Archive names must match the `pack` call in .github/workflows/release.yml.
        gh release download "$tag" --repo "$repo" --pattern "rosfix-$target.*" --pattern "SHA256SUMS" --dir "$dir"
        (cd "$dir" && grep "rosfix-$target\." SHA256SUMS | sha256sum -c -)
        (cd "$dir" && for f in rosfix-$target.*; do case "$f" in *.zip) unzip -q "$f";; *.tar.gz) tar xzf "$f";; esac; done)
        echo "$dir/rosfix-$target/bin" >> "$GITHUB_PATH"
    - name: Run rosfix
      id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_DISTRO: ${{ inputs.distro }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set +e
        sarif="$RUNNER_TEMP/rosfix.sarif"
        distro_arg=()
        [ -n "$INPUT_DISTRO" ] && distro_arg=(--distro "$INPUT_DISTRO")
        # shellcheck disable=SC2086
        rosfix "$INPUT_PATH" --format sarif --output "$sarif" --fail-on "$INPUT_FAIL_ON" "${distro_arg[@]}" $INPUT_ARGS
        code=$?
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: rosfix
    - name: Set up reviewdog
      if: inputs.pr-suggestions == 'true' && github.event_name == 'pull_request'
      uses: reviewdog/action-setup@v1
      with:
        reviewdog_version: v0.20.3
    - name: Post review comments with suggested fixes
      if: inputs.pr-suggestions == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DISTRO: ${{ inputs.distro }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -o pipefail
        distro_arg=()
        [ -n "$INPUT_DISTRO" ] && distro_arg=(--distro "$INPUT_DISTRO")
        # rdjson carries only fixes that pass rosfix's verification as suggestions.
        # shellcheck disable=SC2086
        rosfix "$INPUT_PATH" --format rdjson --fail-on never "${distro_arg[@]}" $INPUT_ARGS \
          | reviewdog -f=rdjson -name=rosfix -reporter=github-pr-review -filter-mode=added -fail-level=none
    - name: Fail on findings
      shell: bash
      run: exit ${{ steps.run.outputs.code }}
