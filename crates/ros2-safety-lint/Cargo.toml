[package]
name = "rosfix"
version = "0.2.3"
edition = "2021"
rust-version = "1.88"
readme = "../../README.md"
description = "Static checker for silent ROS 2 misconfigurations: parameters, topic wiring, QoS, executors, ros2_control, Nav2, launch/packaging and SROS2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SohamWalam11/ros2-safety-lint"
homepage = "https://github.com/SohamWalam11/ros2-safety-lint"
documentation = "https://docs.rs/rosfix"
keywords = ["ros2", "robotics", "linter", "static-analysis", "launch"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "rosfix"
path = "src/main.rs"

[features]
default = []
# Opt-in data parallelism for the indexing stage (`--jobs N`). Off by default:
# the tool is designed to run single-threaded with a small memory footprint.
parallel = ["dep:rayon"]
# Allowlisted web lookups (`--online`), done by a separate helper process.
online = ["dep:ureq"]

[dependencies]
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "gzip"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Runtime for the downloadable assist tiers (--model); no dependencies of its own.
rosfix-model = { path = "../rosfix-model" }
toml = "0.8"
roxmltree = "0.20"
yaml-rust2 = "0.9"
rustpython-parser = "0.4.0"
tree-sitter = "0.20"
tree-sitter-cpp = "0.20"
regex = "1.10"
walkdir = "2.5"
globset = "0.4"
similar = "2.6"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
rayon = { version = "1.10", optional = true }
# Line editing, history and completion in `rosfix shell`.
rustyline = { version = "15.0", default-features = false, features = ["with-file-history"] }

[dev-dependencies]
tempfile = "3.10"
